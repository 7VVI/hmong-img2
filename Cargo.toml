[package]
name = "imgport"
version = "0.1.0"
edition = "2021"
description = "免安装的图片/视频无损传输服务：优先 WebRTC P2P 直连，失败自动回退服务器中转；扫码即收。"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
